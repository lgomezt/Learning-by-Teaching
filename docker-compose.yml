services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: protege-backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: protege-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped
